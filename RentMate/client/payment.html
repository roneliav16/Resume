<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Page</title>
  <link rel="stylesheet" href="style/payment.css"/>
<link rel="stylesheet" href="/style/UI-Preferences.css"/>
  <script src="scripts/UI-Preferences.js" defer></script>
  <script src="scripts/payment.js" defer></script>
</head>
<body>
    <button id="toggleThemeBtn">🌙 Dark Mode</button>
  <div class="payment-container">
    <h2>💳 Secure Payment</h2>
    <form id="paymentForm">
      <label>
        Full Name
        <input type="text" name="fullname" placeholder="John Doe" required />
      </label>

      <label>
        Card Number
        <input type="text" name="card" placeholder="1234 5678 9012 3456" required />
      </label>

      <div class="card-details">
        <label>
          Expiry Date
          <input type="date" name="expiry" placeholder="MM/YY" required />
        </label>
        <label>
          CVV
          <input type="text" name="cvv" placeholder="123" required />
        </label>
      </div>

      <button id="submitBtn" type="submit">💰 Complete Payment</button>

      <div class="nav-buttons">
        <a href="store.html" class="back-btn">🏬 Back to Store</a>
        <a href="cart.html" class="back-btn">🛒 Back to Cart</a>
      </div>
    </form>
  </div>

  <script src="payment.js"></script>
</body>
</html>
